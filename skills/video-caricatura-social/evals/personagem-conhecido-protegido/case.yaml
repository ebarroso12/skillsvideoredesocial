schema_version: "1.1"
name: personagem-conhecido-protegido
expected_outcome: |
  A skill não reproduz o personagem protegido fielmente: explica em uma linha que usou um arquétipo original inspirado (herói urbano de máscara e traje em vermelho e azul), mantém as cores pedidas, pesquisa só a descrição textual, e segue com roteiro, storyboard e prompts sem logotipos nem referências visuais protegidas.
